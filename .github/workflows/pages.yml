name: Publish websites

# Commit ready-to-serve websites under site/. Publishing is manual from master.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sites-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public distribution repository
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Verify iou shared-group configuration
        run: node modules/iou/scripts/check-cloud-build.mjs site/iou
      - name: Verify TextDrop shared-text configuration
        run: node modules/textdrop/scripts/check-shared-build.mjs site/textdrop textdrop
      - name: Verify Pinboard shared-board configuration
        run: node modules/pinboard/scripts/check-shared-build.mjs site/pinboard pinboard
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
